#
# Cloud build: test oxp-cast, cross-compile static musl relay for both common
# OpenWrt soft-router architectures, and package installable .ipk files.
# No OpenWrt SDK needed — ipk is assembled with ar/tar.

name: Build OpenWrt ipk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (oxp-cast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test oxp-cast
        run: cargo test -p oxp-cast

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-musl
          - arch: x86_64
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make curl tar binutils

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            relay/rust
          key: ${{ matrix.arch }}

      - name: Cross-compile static output relay (--cast enabled)
        working-directory: openwrt
        env:
          TARGET: ${{ matrix.target }}
        run: bash build-musl.sh

      - name: Cross-compile static receiver (direlay-linux)
        working-directory: openwrt
        env:
          TARGET: ${{ matrix.target }}
        run: bash build-relay-musl.sh

      - name: Verify binaries are static
        run: |
          for BIN in openwrt/diplay-cast/src/openxplay-relay openwrt/diplay-cast/src/openxplay-receiver; do
            file "$BIN"
            if readelf -l "$BIN" | grep -q INTERP; then
              echo "ERROR: $BIN is dynamically linked" >&2
              exit 1
            fi
            echo "OK: $BIN is static"
          done

      - name: Pack ipk
        working-directory: openwrt
        env:
          TARGET: ${{ matrix.target }}
        run: bash pack-ipk.sh

      - name: Stage uniquely-named binaries
        run: |
          cp openwrt/diplay-cast/src/openxplay-relay openwrt/diplay-cast/src/openxplay-relay-${{ matrix.arch }}
          cp openwrt/diplay-cast/src/openxplay-receiver openwrt/diplay-cast/src/openxplay-receiver-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diplay-cast-${{ matrix.arch }}
          path: |
            openwrt/diplay-cast/src/openxplay-relay-${{ matrix.arch }}
            openwrt/diplay-cast/src/openxplay-receiver-${{ matrix.arch }}
            openwrt/dist/*.ipk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: find artifacts -type f -printf '%p %s bytes\n'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.ipk
            artifacts/**/openxplay-relay-aarch64
            artifacts/**/openxplay-relay-x86_64
            artifacts/**/openxplay-receiver-aarch64
            artifacts/**/openxplay-receiver-x86_64
          generate_release_notes: true
          body: |
            ## DiPlay Cast v0.1.1 — OpenWrt 全栈 CarPlay → DLNA

            **v0.1.1 修复**：把 CarPlay 接收端（direlay-linux）也打进 ipk。现在所有组件都在路由器上运行：接收端连 iPhone → 拉起输出端 → DLNA 推给车机。

            ipk 内含三个二进制：`openxplay-receiver`（接收端主进程）、`oxp-relay`（输出端）、`oxp-relay-wrapper`（注入 --cast 参数）。

            | 文件 | 架构 |
            |---|---|
            | `diplay-cast_*_aarch64_cortex-a53.ipk` | ARMv8 软路由 (N1/R4S/MT6000) |
            | `diplay-cast_*_x86_64.ipk` | x86 软路由 |
            | `openxplay-relay-*` / `openxplay-receiver-*` | 裸静态二进制（手动部署用） |

            **MFi 证书不随包分发**：安装后自行把 `identity.pk8` / `certificate.p7b`
            放到 `/etc/diplay/identity/`（权限 600）。详见仓库 README。
